# Quest 任务定义 · 勇者成长之路（全五章主线 50 环 完整版）
# type: kill=杀怪 / mine=采集 / reach=到达（use-spawn=世界出生点 或 location=显式坐标）
# 双奖励模式：
#   economy  = 装了 TinyAII Economy 时发放（金币+点券+经验(少)+物品）
#   fallback = 没装 Economy 时发放（经验+物品）
#   commands = 双模式都执行（{player} 占位）
#
# 每日任务池已拆分到独立文件 daily-pool.yml（28 个大池）
#
# ============================================================
# 五章平衡总账（详见 QUEST-BALANCE.md）
# 一章 金币20 牛皮套 | 二章 金币30 铁套 | 三章 金币45 散钻4
# 四章 金币60+券2 钻石头盔+盾 | 五章 金币80+券4 图腾+合金剑锋利2(唯一)
# ============================================================

